[alias]
build-firmware = "build -p firmware --target thumbv6m-none-eabi"
flash = "run -p firmware --target thumbv6m-none-eabi"
cable = "run -p mb-cable"
build-gba = "run -p xtask -- gba"
upload = "run -p mb-uploader"
dump = "run -p mb-dumper"

[target.thumbv6m-none-eabi]
runner = "picotool load -u -v -x -t elf"
